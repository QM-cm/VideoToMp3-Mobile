<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5BC0A8">
<title>视频转 MP3 助手</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="转MP3">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="toast" class="toast" hidden></div>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="logo">♪</div>
  <div class="top-title">
    <h1>视频转 MP3 助手</h1>
    <p id="server-status">连接中…</p>
  </div>
  <button id="btn-add" class="btn btn-primary btn-round">＋</button>
</header>

<main id="app">

  <!-- 添加卡片 -->
  <section id="add-panel" class="card add-card" hidden>
    <div class="card-head">
      <span>添加链接</span>
      <button id="btn-paste" class="btn btn-ghost">📋 粘贴</button>
    </div>
    <textarea id="url-input" rows="3" placeholder="粘贴视频链接，支持多行批量
支持 B站 / YouTube / 抖音 / 快手 等公开视频"></textarea>
    <div class="row">
      <span class="hint">音质</span>
      <select id="quality-sel">
        <option value="standard">普通 128k MP3</option>
        <option value="high" selected>高频 320k MP3</option>
        <option value="lossless">无损 FLAC</option>
      </select>
    </div>
    <div class="row">
      <span class="hint">歌名</span>
      <input id="custom-title" type="text" placeholder="自定义标题（留空用原名）">
    </div>
    <details class="clip-box">
      <summary>长度设置（可选）</summary>
      <div class="row row-3">
        <input id="start-t" class="time-input" placeholder="开始 00:00">
        <input id="end-t" class="time-input" placeholder="结束">
        <input id="max-t" class="time-input" placeholder="最长">
      </div>
      <p class="tiny-hint">mm:ss 格式 · 结束/最长二选一，同时设置取较短</p>
    </details>
    <button id="btn-confirm-add" class="btn btn-primary btn-block">添加任务</button>
  </section>

  <!-- 任务列表 -->
  <section id="tasks-panel" class="panel">
    <div class="panel-head">
      <span>任务队列</span>
      <button id="btn-clear-done" class="btn btn-ghost btn-sm">清除已完成</button>
    </div>
    <div id="task-list" class="task-list">
      <div class="empty">🎵<br>粘贴链接，一键带走好听的歌</div>
    </div>
  </section>

  <!-- 历史记录 -->
  <section id="history-panel" class="panel" hidden>
    <div class="panel-head">
      <span>历史记录</span>
      <button id="btn-clear-history" class="btn btn-ghost btn-sm danger">清空</button>
    </div>
    <input id="history-search" type="search" placeholder="搜索标题 / 作者 / 链接">
    <div id="history-list" class="task-list">
      <div class="empty">暂无历史记录</div>
    </div>
  </section>

  <!-- 设置 -->
  <section id="settings-panel" class="panel" hidden>
    <div class="panel-head"><span>设置</span></div>
    <div class="card settings-card">
      <div class="row">
        <span class="hint">默认音质</span>
        <select id="set-quality">
          <option value="standard">普通 128k MP3</option>
          <option value="high">高频 320k MP3</option>
          <option value="lossless">无损 FLAC</option>
        </select>
      </div>
      <div class="row">
        <span class="hint">并发任务数</span>
        <select id="set-concurrency">
          <option value="1">1（默认）</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="row">
        <span class="hint">采样率</span>
        <select id="set-rate">
          <option value="44100">44100 Hz（默认）</option>
          <option value="48000">48000 Hz</option>
        </select>
      </div>
      <div class="row">
        <span class="hint">响度标准化</span>
        <label class="switch">
          <input id="set-normalize" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span class="hint">命名模板</span>
        <input id="set-template" type="text" value="{artist} - {title}.mp3">
      </div>
      <div class="row">
        <span class="hint">嵌入封面</span>
        <label class="switch">
          <input id="set-cover" type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>
      <button id="btn-save-settings" class="btn btn-primary btn-block">保存设置</button>
    </div>
    <p class="tiny-hint center legal">仅处理你有权下载的内容 · 不绕过 DRM / 付费墙 / 登录限制</p>
  </section>

</main>

<!-- 底部导航 -->
<nav class="tabbar">
  <button class="tab active" data-panel="tasks">🎵<span>任务</span></button>
  <button class="tab" data-panel="history">📜<span>历史</span></button>
  <button class="tab" data-panel="settings">⚙<span>设置</span></button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
